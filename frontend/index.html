<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Cricket Live Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Test Cricket Live Tracker</h1>
  </header>
  <main>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="live">Live Tests</button>
      <button class="tab-btn" data-tab="upcoming">Upcoming</button>
      <button class="tab-btn" data-tab="wtc">WTC Race</button>
    </nav>
    <section id="tab-live" class="tab-panel">
      <h2>Live Tests</h2>
      <p id="updated" class="note"></p>
      <div id="live" class="grid">Loading...</div>
    </section>
    <section id="tab-upcoming" class="tab-panel" hidden>
      <h2>Upcoming Test Series</h2>
      <p id="upcoming-note" class="note"></p>
      <div id="upcoming" class="grid">Loading...</div>
    </section>
    <section id="tab-wtc" class="tab-panel" hidden>
      <h2>World Test Championship</h2>
      <p id="wtc-note" class="note"></p>
      <div id="wtc">Loading...</div>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="wtc.js"></script>
  <script src="upcoming.js"></script>
</body>
</html>
